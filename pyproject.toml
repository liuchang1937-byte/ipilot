[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "techrag"
version = "0.1.0"
description = "A RAG-first, Agent-driven mock interview learning platform backed by Chroma."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TechRAG contributors" }]
dependencies = [
  "chromadb>=1.5,<2",
  "fastapi>=0.115,<1",
  "litellm>=1.60,<2",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "python-dotenv>=1.0,<2",
  "reportlab>=4.2,<5",
  "tokenizers>=0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "httpx>=0.27,<1"]
rerank = ["FlagEmbedding>=1.3,<2"]
documents = [
  "markitdown[all]>=0.1.4,<0.2",
  "pdftext>=0.4.1,<0.7",
]

[project.scripts]
techrag = "techrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/techrag"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".uv-cache", ".uv-python", ".tmp", "uv-cache-work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
